    "foundingDate": "2025",
    "areaServed": "MY",
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "availableLanguage": ["English", "Malay"]
    },
    "sameAs": [
      "https://facebook.com/eventease",
      "https://instagram.com/eventease",
      "https://twitter.com/eventease"
    ]
  }
  </script>

  <!-- JSON-LD Structured Data: WebSite / SiteSearch -->
  <script type="application/ld+json">

    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "EventEase",
    "url": "https://eventease.com",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://eventease.com/#/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

<body>
  <!-- Loading indicator while Flutter boots (hidden once Flutter takes over) -->
  <div id="loading" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:Arial,sans-serif;">
    <div style="font-size:18px;color:#6366F1;margin-bottom:10px;font-weight:bold;">EventEase</div>
    <div style="width:40px;height:40px;border:4px solid #e0e0ff;border-top:4px solid #6366F1;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
  </div>
  <style>
    @keyframes spin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    body { margin: 0; background: #F9FAFB; }
  </style>

  <!-- Flutter Bootstrap — loads immediately, no Maps dependency -->
  <script>
    // Hide the loading indicator once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) loading.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
