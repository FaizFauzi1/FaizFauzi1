[build]
  publish = "build/web"
  command = "flutter build web --release"

# Exclude .well-known from redirects to allow deep link verification
[[redirects]]
  from = "/.well-known/*"
  status = 200

# Redirect all vendor and service URLs to index.html for client-side routing
[[redirects]]
  from = "/vendor/:vendorId"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/service/:serviceId"
  to = "/index.html"
  status = 200

# Catch-all redirect for SPA routing (only if file doesn't exist)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
